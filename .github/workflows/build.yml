name: Build APK

on:
  push:
    branches:
      - main
      - 'feature/**'
    tags:
      - 'v*'
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code (build_runner)
        run: dart run build_runner build

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Run tests with coverage
        run: flutter test --coverage

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        # 非关键步骤：coverage 报告是可选产物，失败不应阻塞 APK 构建/发布。
        # GitHub Actions 的 artifact 存储配额耗尽时会报错（账号级限制，非代码问题），
        # 用 continue-on-error 让流水线继续执行后续的 APK 构建。
        continue-on-error: true
        with:
          name: coverage-lcov
          path: coverage/lcov.info

      # 解码 keystore secret 到文件（用于 release 签名）
      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/release.keystore
          echo "KEYSTORE_PATH=$(pwd)/android/app/release.keystore" >> $GITHUB_ENV

      # release 构建（debug 约 150MB，release 约 30MB）
      # abiFilters=arm64-v8a（见 build.gradle.kts）已限制只打单 ABI，无需 --split-per-abi
      # 注：abiFilters 与 splits abi 互斥，混用会报 "Conflicting configuration"
      - name: Build release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: flutter build apk --release --obfuscate --split-debug-info=build/app/outputs/symbols

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        # 同 coverage：artifact 存储配额耗尽时不阻塞，APK 已在上一部生成成功。
        # 配额恢复后可重新触发 run 重新上传。
        continue-on-error: true
        with:
          name: mengtu-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/app-release.apk
          generate_release_notes: true
