name: mengtu
description: "萌图 — 面向摄影爱好者的照片灵感收集与调色参考工具"
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.2.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  # 状态管理
  flutter_riverpod: ^3.3.0
  riverpod_annotation: ^4.0.0

  # 数据库
  drift: ^2.15.0
  sqlite3_flutter_libs: ^0.5.0

  # 图片处理
  image: ^4.9.1
  material_color_utilities: ^0.13.0

  # EXIF 元数据解析（纯 Dart，可在 Isolate 内读取 JPEG 字节）
  exif: ^3.3.0

  # 照片选择
  wechat_assets_picker: ^10.1.2
  photo_manager: ^3.9.0

  # UI
  flutter_staggered_grid_view: ^0.7.0

  # 工具
  uuid: ^4.0.0
  path_provider: ^2.0.0
  path: ^1.8.0
  crypto: ^3.0.7
  reorderable_grid_view: ^2.2.8
  shared_preferences: ^2.5.5

  # v3.0: 离线人脸检测（BlazeFace TFLite 模型）—— 人像肤色 ROI 提取
  tflite_flutter: ^0.11.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # 代码生成
  drift_dev: ^2.15.0
  riverpod_generator: ^4.0.0
  build_runner: ^2.15.0

  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  # v3.0: BlazeFace 离线人脸检测模型（short_range 主用，full_range 远距离备份）
  # v3.5: face_mesh.tflite（468 landmarks，STI/FLC 依赖）暂未注册 —— 模型文件
  # 需从 https://github.com/google-ai-edge/mediapipe 下载放入 assets/models/
  # 后，再取消下行注释。缺失时 advancedMetricsProvider 降级（STI/FLC null，
  # black_point/white_point/ten_tonal 正常算）。
  assets:
    - assets/models/face_detection_short_range.tflite
    - assets/models/face_detection_full_range_sparse.tflite
    # - assets/models/face_mesh.tflite # v3.5：模型文件待补，缺失自动降级
