name: mengtu
description: "萌图 — 面向摄影爱好者的照片灵感收集与调色参考工具"
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.3.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  # 状态管理
  flutter_riverpod: ^3.3.0
  riverpod_annotation: ^4.0.0

  # 数据库
  drift: ^2.15.0
  sqlite3_flutter_libs: ^0.5.0

  # 图片处理
  image: ^4.9.1
  material_color_utilities: ^0.13.0

  # EXIF 元数据解析（纯 Dart，可在 Isolate 内读取 JPEG 字节）
  exif: ^3.3.0

  # 照片选择
  wechat_assets_picker: ^10.1.2
  photo_manager: ^3.9.0

  # UI
  flutter_staggered_grid_view: ^0.7.0

  # 工具
  uuid: ^4.0.0
  path_provider: ^2.0.0
  path: ^1.8.0
  crypto: ^3.0.7
  reorderable_grid_view: ^2.2.8
  shared_preferences: ^2.5.5

  # v7.0: SCRFD 人脸检测（NCNN FFI 插件，CPU 推理，无 GMS 依赖）
  #   - 替代 BlazeFace TFLite + Google ML Kit（解决识别率/GMS 依赖问题）
  #   - 模型 scrfd_2.5g_kps-opt2 随插件 assets 打包，~1.6MB
  #   - 输出 bbox + 5 关键点（眼/鼻/嘴角），bbox 用于肤色 ROI
  scrfd_ncnn:
    path: scrfd_ncnn_plugin

dev_dependencies:
  flutter_test:
    sdk: flutter

  # 代码生成
  drift_dev: ^2.15.0
  riverpod_generator: ^4.0.0
  build_runner: ^2.15.0

  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  # v7.0: SCRFD 模型（scrfd_2.5g_kps-opt2.param/.bin）由 scrfd_ncnn 插件自带 assets
  # 打包（见 scrfd_ncnn_plugin/pubspec.yaml），主应用无需在此重复声明。
  # v3.0/v3.5 的 BlazeFace + face_mesh .tflite 已随 tflite_flutter 移除而删除。
  # （保留空 assets 块以便未来扩展；如有应用级 asset 在此追加。）
